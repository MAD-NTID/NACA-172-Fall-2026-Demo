<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--This is an example of a parent/child nested container-->
    <!--The "main" is the parent of everything inside it-->
    <main>
        <!--h1 and all other elements are children of main-->
        <h1>My Favorite Colors</h1>
        <!--section is also a parent of all paragraph-->
        <section>
            <p>Paragraph one</p>
            <p>Paragraph two</p>
            <p>Concluding Paragraph</p>
        </section>

        <!--You cannot nested some elements...
        p elements are example of that-->
        <p>
            Hello This is a paragraph
            <!--You cannot do this...It is invalid
            It may show up fine in the browser but it is illegal-->
            <!--<p>Hello I am a nested paragraph</p>-->
        </p>

        <p>
            Part of my research came from <cite>[Smith 2022]</cite>
        </p>

    </main>

</body>
</html>
