
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Tournament Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #151525;
            color: white;
            padding: 30px;
        }

        .form-container {
            max-width: 500px;
            margin: auto;
            background: #25253d;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #a78bfa;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #ccc;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #35354d;
            color: white;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .options label {
            display: inline-block;
            margin-right: 15px;
        }

        textarea {
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit {
            background: #8b5cf6;
            color: white;
        }

        .reset {
            background: #555;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

    </style>
</head>

<body>

    <div class="form-container">

        <h1>🎮 Game Tournament</h1>
        <p class="description">Register now and join the competition!</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="username">Player Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="game">Choose Your Game</label>
                <select id="game" name="game" required>
                    <option value="">-- Select a game --</option>
                    <option value="minecraft">Minecraft</option>
                    <option value="valorant">Valorant</option>
                    <option value="fortnite">Fortnite</option>
                    <option value="minecraft">League of Legends</option>
                    <option value="pubg">PUBG</option>
                </select>
            </div>

            <div class="form-group">
                <label>Player Level</label>
                <div class="options">
                    <label><input type="radio" name="level" value="beginner"> Beginner</label>
                    <label><input type="radio" name="level" value="intermediate"> Intermediate</label>
                    <label><input type="radio" name="level" value="pro"> Pro</label>
                </div>
            </div>

            <div class="form-group">
                <label for="platform">Gaming Platform</label>
                <select id="platform" name="platform">
                    <option value="">Select platform</option>
                    <option value="pc">PC</option>
                    <option value="playstation">PlayStation</option>
                    <option value="xbox">Xbox</option>
                    <option value="mobile">Mobile</option>
                </select>
            </div>

            <div class="form-group">
                <label for="team">Team Name</label>
                <input type="text" id="team" name="team"
                       placeholder="Enter your team name">
            </div>

            <div class="form-group">
                <label for="message">Why do you want to join?</label>
                <textarea id="message" name="message" rows="4"
                          placeholder="Write something..."></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="agreement" required>
                    I agree to the tournament rules.
                </label>
            </div>

            <div class="buttons">
                <button type="submit" class="submit">Register</button>
                <button type="reset" class="reset">Clear</button>
            </div>

        </form>

    </div>

    <script>
        //get the form
        const form = document.querySelector('form');

        //bind it to an event listener for when someone try to submit
        form.addEventListener('submit', (event)=>{
            //block it from jumping
            event.preventDefault();

            //prevent email from being used as username
            const username = document.getElementById('username');
            const email = document.getElementById('email');

  
            if(username.value === email.value){
                alert("Nope, you cannot use email as username!!!!");
            } else{
                //if the email and username are not the same we remove the prevent default
                form.submit();
            }
        });
    </script>

</body>
</html>
