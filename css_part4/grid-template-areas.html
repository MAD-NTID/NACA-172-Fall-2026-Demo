<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Areas</title>
    <style>
        body {
            display: grid;

            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 80px auto 60px;

            grid-template-areas: 
                "header header header"
                "nav main aside"
                "footer footer footer";
        }

        header { grid-area: header; background: lightcoral; }
        nav    { grid-area: nav;    background: lightblue; }
        main   { grid-area: main;   background: lightgreen; }
        aside  { grid-area: aside;  background: khaki; }
        footer { grid-area: footer; background: plum; }
    </style>
</head>
<body>
    <header>Header</header>
    <nav>Nav</nav>
    <main>Main</main>
    <aside>Aside</aside>
    <footer>Footer</footer>
</body>
</html>
