<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridbox</title>
    <style>
        body {
            display: grid;

            grid-template-columns: 1fr;
            grid-template-rows: 1fr auto 2fr;
        }

        header, main, aside, footer {
            border: 1px solid black;
        }

        section, div {
            border: 1px dashed blue;
        }
    </style>
</head>
<body>
    <header>
        <h1>header <small>(fixed height 1fr)</small></h1>
    </header>

    <main>
        <h1>main <small>(flexible row auto)</small></h1>
    </main>

    <footer>
        <h1>footer <small>(fixed height 2fr)</small></h1>
    </footer>
</body>
</html>
