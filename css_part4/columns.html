<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridbox</title>
    <style>
        body {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;
        }

        header, main, footer {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <header>
        <h1>header</h1>
    </header>

    <main>
        <h1>main</h1>
    </main>

    <footer>
        <h1>footer</h1>
    </footer>
</body>
</html>
